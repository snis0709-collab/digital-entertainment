<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Entertainment Museum</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-card" aria-label="Login form">
        <div class="login-brand">Digital Entertainment Museum</div>
        <p class="login-subtitle">Welcome to the evolution of play, screen, and sound.</p>

        <form class="login-form" action="index.html" method="get">
          <label class="label-block" for="username">
            Username
            <input class="input-field" type="text" id="username" name="username" placeholder="Enter username" />
          </label>

          <label class="label-block" for="password">
            Password
            <input class="input-field" type="password" id="password" name="password" placeholder="Enter password" />
          </label>

          <button type="submit" class="submit-btn">Login / Continue</button>
        </form>

        <p class="login-note">This is a classroom demo. No personal data is stored.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
